name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**"]
  pull_request:
    branches: [main]
    paths: ["backend/**"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: billtrail
          POSTGRES_PASSWORD: billtrail
          POSTGRES_DB: billtrail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://billtrail:billtrail@localhost:5432/billtrail_test
      DATABASE_URL: postgresql://billtrail:billtrail@localhost:5432/billtrail_test
      JWT_ACCESS_SECRET: ci-test-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-test-secret-at-least-32-characters-long-but-different
      PAYSTACK_SECRET_KEY: sk_test_ci_placeholder
      RESEND_API_KEY: re_ci_placeholder
      EMAIL_FROM: "BillTrail <test@example.com>"
      FRONTEND_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm install

      - run: npx prisma migrate deploy

      - run: npx tsc --noEmit

      - run: npm run lint

      - run: npm run format:check

      - run: npm test